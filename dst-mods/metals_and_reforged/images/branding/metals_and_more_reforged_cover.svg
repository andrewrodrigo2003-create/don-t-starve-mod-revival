<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Metals and More Reforged — original cover artwork</title>
<desc id="desc">An original industrial fantasy illustration featuring a forge, anvil, hammer, ore and refined metal ingots.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#171b2b"/><stop offset=".58" stop-color="#292437"/><stop offset="1" stop-color="#111722"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#ffcf73" stop-opacity=".8"/><stop offset=".45" stop-color="#ef7135" stop-opacity=".28"/><stop offset="1" stop-color="#ef7135" stop-opacity="0"/></radialGradient>
 <linearGradient id="steel" x2="0" y2="1"><stop stop-color="#d8dce2"/><stop offset=".45" stop-color="#778293"/><stop offset="1" stop-color="#303846"/></linearGradient>
 <linearGradient id="copper" x2="0" y2="1"><stop stop-color="#ffbd77"/><stop offset=".5" stop-color="#b9663e"/><stop offset="1" stop-color="#623c37"/></linearGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff0a1"/><stop offset=".55" stop-color="#d49a3c"/><stop offset="1" stop-color="#79502c"/></linearGradient>
 <pattern id="grain" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M2 8h7M22 26h9M13 17h3" stroke="#d7c6a4" stroke-opacity=".09" stroke-width="1"/></pattern>
 <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect width="1200" height="675" fill="url(#grain)"/>
