name: DST minimap performance contract

on:
  pull_request:
    paths:
      - "dst-mods/metals_and_reforged/initialise/modded_map.lua"
      - "tests/test_minimap_update_optimization.py"
      - ".github/workflows/dst-minimap-performance-contract.yml"
  push:
    paths:
      - "dst-mods/metals_and_reforged/initialise/modded_map.lua"
      - "tests/test_minimap_update_optimization.py"
      - ".github/workflows/dst-minimap-performance-contract.yml"

permissions:
  contents: read

jobs:
  minimap-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Run minimap source contract tests
        run: python -m unittest discover -s tests -p "test_minimap_update_optimization.py" -v
