name: DST minimap performance contract

on:
  pull_request:
    paths:
      - "dst-mods/metals_and_reforged/initialise/modded_map.lua"
      - "tests/test_minimap_update_optimization.py"
      - ".github/workflows/dst-minimap-performance-contract.yml"
  push:
    paths:
      - "dst-mods/metals_and_reforged/initialise/modded_map.lua"
      - "tests/test_minimap_update_optimization.py"
      - ".github/workflows/dst-minimap-performance-contract.yml"

permissions:
  contents: read

jobs:
  minimap-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run minimap source contract tests
        run: python -m unittest discover -s tests -p "test_minimap_update_optimization.py" -v
