name: MAM localization contracts

on:
  push:
    branches:
      - feature/full-crafting-rework-localization-2026-11-12
  pull_request:
    branches:
      - main
    paths:
      - "dst-mods/metals_and_reforged/modinfo.lua"
      - "dst-mods/metals_and_reforged/modmain.lua"
      - "dst-mods/metals_and_reforged/initialise/modded_strings.lua"
      - "dst-mods/metals_and_reforged/scripts/mam/config.lua"
      - "tests/test_mam_localization.py"
      - ".github/workflows/mam-localization-contracts.yml"

permissions:
  contents: read

jobs:
  localization-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run localization contracts
        run: python -m unittest discover -s tests -p "test_mam_localization.py" -v
