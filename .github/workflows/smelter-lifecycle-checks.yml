name: Smelter lifecycle regression checks

on:
  push:
    branches:
      - fix/smelter-interruption-leftovers
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smelter-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1
      - name: Parse component and run lifecycle harness
        run: |
          set -euo pipefail
          luac5.1 -p dst-mods/metals_and_reforged/scripts/components/smelter.lua
          luac5.1 -p dst-mods/tests/smelter_component_lifecycle_test.lua
          lua5.1 dst-mods/tests/smelter_component_lifecycle_test.lua
