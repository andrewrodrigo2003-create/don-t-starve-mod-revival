name: MAM smelter component tests

on:
  push:
    branches:
      - fix/smelter-idle-update-lifecycle-2026-11-09
  pull_request:
    branches:
      - main
    paths:
      - 'dst-mods/metals_and_reforged/scripts/components/smelter.lua'
      - 'tests/smelter_component_test.lua'
      - '.github/workflows/mam-smelter-tests.yml'

permissions:
  contents: read

jobs:
  smelter-component-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Check Lua syntax
        run: |
          luac5.1 -p dst-mods/metals_and_reforged/scripts/components/smelter.lua
          luac5.1 -p tests/smelter_component_test.lua
      - name: Test smelter update lifecycle
        run: lua5.1 tests/smelter_component_test.lua
