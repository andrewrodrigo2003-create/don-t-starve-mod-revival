name: MAM wrapper AST audit

on:
  pull_request:
    paths:
      - 'dst-mods/metals_and_reforged/**'
      - '.github/workflows/mam-wrapper-ast-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrapper-ast:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-audit-ast.txt

      - name: Install isolated AST audit dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-audit-ast.txt

      - name: Run static audit regression tests
        run: python -m unittest discover -s tests -p 'test_dst_*audit.py' -v

      - name: Audit Metals and More wrapper chains
        shell: bash
        run: |
          set -euo pipefail
          if python tools/dst_wrapper_audit.py dst-mods/metals_and_reforged --output "$RUNNER_TEMP/mam-wrapper-ast-audit.json"; then
            echo "AST scan completed without parser errors."
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
            echo "Some Lua files could not be parsed; inspect the report artifact."
          fi

      - name: Upload wrapper AST report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned upload-artifact action
        with:
          name: mam-wrapper-ast-audit
          path: ${{ runner.temp }}/mam-wrapper-ast-audit.json
          if-no-files-found: error
          retention-days: 14
