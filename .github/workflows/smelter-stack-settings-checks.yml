name: Smelter server stack settings checks

on:
  push:
    branches:
      - fix/smelter-server-stack-setting
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1
      - name: Parse integration files and run stack settings harness
        run: |
          set -euo pipefail
          luac5.1 -p dst-mods/metals_and_reforged/scripts/mam/container_settings.lua
          luac5.1 -p dst-mods/metals_and_reforged/initialise/modded_cookers.lua
          luac5.1 -p dst-mods/metals_and_reforged/scripts/prefabs/metal_smelter.lua
          luac5.1 -p dst-mods/tests/smelter_stack_settings_test.lua
          lua5.1 dst-mods/tests/smelter_stack_settings_test.lua
