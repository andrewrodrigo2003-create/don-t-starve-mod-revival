name: Metals and More smelting planner tests

on:
  push:
    branches:
      - test/smelting-plan-coverage-2026-11-09
  pull_request:
    branches:
      - main
    paths:
      - 'dst-mods/metals_and_reforged/scripts/smelting.lua'
      - 'dst-mods/metals_and_reforged/scripts/smelting_products.lua'
      - 'tests/smelting_plan_test.lua'
      - '.github/workflows/mam-smelting-plan-tests.yml'

permissions:
  contents: read

jobs:
  smelting-planner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Check Lua syntax
        run: |
          luac5.1 -p dst-mods/metals_and_reforged/scripts/smelting.lua
          luac5.1 -p dst-mods/metals_and_reforged/scripts/smelting_products.lua
          luac5.1 -p tests/smelting_plan_test.lua
      - name: Test smelting planner and material conservation
        run: lua5.1 tests/smelting_plan_test.lua
