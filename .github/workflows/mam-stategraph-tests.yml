name: MAM stategraph wrapper contract

on:
  push:
    branches:
      - fix/stategraph-callback-wrappers-2026-11-09
  pull_request:
    branches:
      - main
    paths:
      - 'dst-mods/metals_and_reforged/scripts/mod_main.lua'
      - 'dst-mods/metals_and_reforged/scripts/mam/stategraph_wrappers.lua'
      - 'dst-mods/tests/weapon_compatibility_contract_test.lua'
      - '.github/workflows/mam-stategraph-tests.yml'

permissions:
  contents: read

jobs:
  stategraph-wrapper-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Parse stategraph wrapper files
        run: |
          luac5.1 -p dst-mods/metals_and_reforged/scripts/mod_main.lua
          luac5.1 -p dst-mods/metals_and_reforged/scripts/mam/stategraph_wrappers.lua
          luac5.1 -p dst-mods/tests/weapon_compatibility_contract_test.lua
      - name: Run stategraph and weapon compatibility contract
        run: lua5.1 dst-mods/tests/weapon_compatibility_contract_test.lua
