name: DST Lua wrapper AST audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/dst_wrapper_audit.py"
      - "tools/dst_mod_audit.py"
      - "tools/requirements-audit-ast.txt"
      - "tests/test_dst_wrapper_audit.py"
      - "tests/test_dst_mod_audit.py"
      - ".github/workflows/dst-wrapper-ast-audit.yml"
      - "docs/engineering/SOFTWARE_FORENSICS_AND_COMPATIBILITY.md"
      - "docs/engineering/DST-COMBAT-WRAPPER-CONTRACT-AUDIT.md"
  push:
    paths:
      - "tools/dst_wrapper_audit.py"
      - "tools/dst_mod_audit.py"
      - "tools/requirements-audit-ast.txt"
      - "tests/test_dst_wrapper_audit.py"
      - "tests/test_dst_mod_audit.py"
      - ".github/workflows/dst-wrapper-ast-audit.yml"

permissions:
  contents: read

jobs:
  wrapper-ast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements-audit-ast.txt
      - name: Install isolated AST audit dependencies
        run: python -m pip install -r tools/requirements-audit-ast.txt
      - name: Run static audit regression tests
        run: python -m unittest discover -s tests -p "test_dst_*audit.py" -v
      - name: Audit Metals and More wrapper chains
        shell: bash
        run: |
          if python tools/dst_wrapper_audit.py dst-mods/metals_and_reforged --output "$RUNNER_TEMP/metals-and-more-wrapper-ast-audit.json"; then
            echo "AST scan completed without parser errors."
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
            echo "Some Lua files could not be parsed; inspect the report artifact."
          fi
      - name: Upload wrapper AST report
        uses: actions/upload-artifact@v4
        with:
          name: metals-and-more-wrapper-ast-audit
          path: ${{ runner.temp }}/metals-and-more-wrapper-ast-audit.json
          if-no-files-found: error
          retention-days: 14
