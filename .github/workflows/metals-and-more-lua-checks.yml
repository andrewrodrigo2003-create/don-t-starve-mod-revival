name: Metals and More Lua checks

on:
  push:
    branches:
      - fix/allow-ambiguous-smelting
  pull_request:
    branches:
      - main
    paths:
      - 'dst-mods/metals_and_reforged/scripts/smelting.lua'
      - 'dst-mods/metals_and_reforged/scripts/mam/forecast.lua'
      - 'dst-mods/tests/forecast_ambiguous_start_test.lua'
      - '.github/workflows/metals-and-more-lua-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smelting-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Parse changed Lua modules and test
        run: |
          luac5.1 -p dst-mods/metals_and_reforged/scripts/smelting.lua
          luac5.1 -p dst-mods/metals_and_reforged/scripts/mam/forecast.lua
          luac5.1 -p dst-mods/tests/forecast_ambiguous_start_test.lua
          lua5.1 dst-mods/tests/forecast_ambiguous_start_test.lua
