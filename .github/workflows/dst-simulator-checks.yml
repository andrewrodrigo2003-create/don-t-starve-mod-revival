name: DST behavioral simulator

on:
  pull_request:
    branches: [main]
    paths:
      - 'dst-mods/tests/simulator/**'
      - 'dst-mods/tests/simulator_bootstrap_test.lua'
      - '.github/workflows/dst-simulator-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Parse simulator Lua files
        run: |
          set -euo pipefail
          find dst-mods/tests/simulator -type f -name '*.lua' -print0 |
            while IFS= read -r -d '' file; do
              luac5.1 -p "$file"
            done
          luac5.1 -p dst-mods/tests/simulator_bootstrap_test.lua

      - name: Run simulator self-test
        run: lua5.1 dst-mods/tests/simulator_bootstrap_test.lua
