name: DST behavioral simulator
on:
  pull_request:
    branches: [main]
    paths:
      - 'dst-mods/tests/simulator/**'
      - 'dst-mods/tests/smelter_simulator_integration_test.lua'
      - 'dst-mods/tests/stategraph_compatibility_test.lua'
      - 'dst-mods/tests/container_widget_compatibility_test.lua'
      - 'dst-mods/tests/character_ability_compatibility_test.lua'
      - 'dst-mods/metals_and_reforged/scripts/components/smelter.lua'
      - 'dst-mods/metals_and_reforged/scripts/mod_main.lua'
      - 'dst-mods/metals_and_reforged/scripts/mam/stategraph_wrappers.lua'
      - 'dst-mods/metals_and_reforged/initialise/modded_cookers.lua'
      - 'dst-mods/metals_and_reforged/initialise/modded_stronger_bernie.lua'
      - '.github/workflows/dst-simulator-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1
      - name: Parse simulator and scenario Lua files
        run: |
          set -euo pipefail
          find dst-mods/tests/simulator -type f -name '*.lua' -print0 |
            while IFS= read -r -d '' file; do luac5.1 -p "$file"; done
          for file in \
            dst-mods/tests/smelter_simulator_integration_test.lua \
            dst-mods/tests/stategraph_compatibility_test.lua \
            dst-mods/tests/container_widget_compatibility_test.lua \
            dst-mods/tests/character_ability_compatibility_test.lua
          do luac5.1 -p "$file"; done
      - name: Run simulator scenarios
        run: |
          set -euo pipefail
          lua5.1 dst-mods/tests/stategraph_compatibility_test.lua
          lua5.1 dst-mods/tests/container_widget_compatibility_test.lua
          lua5.1 dst-mods/tests/character_ability_compatibility_test.lua
          lua5.1 dst-mods/tests/smelter_simulator_integration_test.lua
