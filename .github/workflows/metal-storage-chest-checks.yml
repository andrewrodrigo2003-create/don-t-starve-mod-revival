name: Metal storage chest regression checks

on:
  push:
    branches:
      - feature/metal-storage-chest
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metal-storage-chest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1
      - name: Parse changed Lua files
        run: |
          set -euo pipefail
          luac5.1 -p dst-mods/metals_and_reforged/scripts/mam/metal_storage.lua
          luac5.1 -p dst-mods/metals_and_reforged/scripts/smelting.lua
          luac5.1 -p dst-mods/metals_and_reforged/scripts/smelting_products.lua
          luac5.1 -p dst-mods/metals_and_reforged/scripts/prefabs/metal_storage_chest.lua
          luac5.1 -p dst-mods/metals_and_reforged/modmain.lua
          luac5.1 -p dst-mods/tests/metal_storage_chest_test.lua
      - name: Run prefab and real ingredient-filter harness
        run: |
          set -euo pipefail
          lua5.1 dst-mods/tests/metal_storage_chest_test.lua
