name: Metals and More recipe-module checks

on:
  push:
    branches:
      - test/smelting-module-harness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smelting-module:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Parse modules and run real recipe planner harness
        run: |
          luac5.1 -p dst-mods/metals_and_reforged/scripts/smelting.lua
          luac5.1 -p dst-mods/metals_and_reforged/scripts/smelting_products.lua
          luac5.1 -p dst-mods/tests/smelting_module_harness.lua
          lua5.1 dst-mods/tests/smelting_module_harness.lua
